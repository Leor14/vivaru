    value: AIzaSyDRvUIFC9SiODRNaBJkN5rNXRm3bYu4JxA
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hogaru-1.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hogaru-1
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: hogaru-1.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1047056648517"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1047056648517:web:a76ad8d0cb2138c3d9d62c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-L1XRDSMWBG
    availability:
      - BUILD
      - RUNTIME

  # ── Ambiente ──────────────────────────────────────────────────────────────
  # ESTA RAMA (master) DESPLIEGA A PRODUCCIÓN → siempre "production".
  # En develop este valor debe ser "staging". Gobierna: noindex/robots.txt,
  # banda "AMBIENTE DE PRUEBAS", desvío del correo comercial y analítica
  # (ver docs/plan-self-service-trial.md §13). Necesita BUILD porque el bundle
  # del cliente lo inlinea.
  # ⚠️ Al mergear desde develop, CONSERVAR "production" — ponerlo en "staging"
  # desindexaría el sitio real de Google.
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  # ── Resend — Email transaccional ──────────────────────────────────────────
  # RESEND_API_KEY se configura desde la consola de Firebase App Hosting
  # (App Hosting → tu backend → Variables de entorno) para no exponerla en git.

  - variable: LEAD_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  - variable: DEMO_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  # Remitente verificado, el mismo que usan las Cloud Functions
  # (functions/src/email.ts). El anterior, `onboarding@resend.dev`, es el
  # dominio de PRUEBAS de Resend: solo entrega al dueño de la cuenta, así que
  # los avisos de lead a comercial@qintilab.com se perdían en silencio.
  - variable: LEAD_NOTIFICATION_FROM
    value: Vivaru <noreply@notificaciones.grupovivaru.com>
    availability:
      - RUNTIME
