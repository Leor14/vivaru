runConfig:
  minInstances: 0
  maxInstances: 5
  cpu: 1
  memoryMiB: 512

# NOTA (rama develop = STAGING): la config de Firebase apunta a vivaru-staging-02 a
# propósito. El backend de staging (vivaru-staging-web) construye de develop y lee este
# apphosting.yaml (no tiene "Environment name = staging", por lo que apphosting.staging.yaml
# es inerte). En master estos valores son los de prod (hogaru-1). Al fusionar master ->
# develop, resolver el conflicto de este archivo MANTENIENDO los valores de staging.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyChPlJL3WESeNggGXBPMiHzIAAicEH8J6c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vivaru-staging-02.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vivaru-staging-02
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: vivaru-staging-02.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "765613061037"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:765613061037:web:37c450d7c1a20b4812a724
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-L1XRDSMWBG
    availability:
      - BUILD
      - RUNTIME

  # ── Resend — Email transaccional ──────────────────────────────────────────
  # RESEND_API_KEY se configura desde la consola de Firebase App Hosting
  # (App Hosting → tu backend → Variables de entorno) para no exponerla en git.

  - variable: LEAD_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  - variable: DEMO_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  # Cambiar a "Vivaru <noreply@grupovivaru.com>" cuando el dominio
  # esté verificado en resend.com/domains
  - variable: LEAD_NOTIFICATION_FROM
    value: Vivaru <onboarding@resend.dev>
    availability:
      - RUNTIME
