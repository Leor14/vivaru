  # ── Web Push (PRD-V-PLAT-005) ─────────────────────────────────────────────
  # Clave PUBLICA del par VAPID (la privada vive en FCM y no sale de ahi).
  # Cada proyecto tiene su par: esta NO sirve en el otro ambiente. Generada por
  # David el 29 ago 2026 en Console → Cloud Messaging → Web Push certificates.
  # Necesita BUILD porque registerWebPush() la inlinea en el bundle del cliente.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BERBEo5DJosIuyrf8zY3GUBMsv8b-5juVmqYiFS0pVuW1-QG5fEDpOsDo04fohbeZ7in3mU0P_uKf8QkFQ3Womw
    availability:
      - BUILD
      - RUNTIME

  # ── Ambiente ──────────────────────────────────────────────────────────────
  # ESTA RAMA (master) DESPLIEGA A PRODUCCIÓN → siempre "production".
  # En develop este valor debe ser "staging". Gobierna: noindex/robots.txt,
  # banda "AMBIENTE DE PRUEBAS", desvío del correo comercial y analítica
  # (ver docs/plan-self-service-trial.md §13). Necesita BUILD porque el bundle
  # del cliente lo inlinea.
  # ⚠️ Al mergear desde develop, CONSERVAR "production" — ponerlo en "staging"
  # desindexaría el sitio real de Google.
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  # ── Resend — Email transaccional ──────────────────────────────────────────
  # La clave se REFERENCIA, no se escribe: `secret:` apunta al secreto del mismo
  # nombre en Secret Manager, y App Hosting lo inyecta al arrancar. El backend
  # tiene `secretAccessor` sobre él (`firebase apphosting:secrets:grantaccess`).
  #
  # Hasta el 15 de agosto de 2026 esta clave vivía como variable EN CLARO en la
  # consola del backend. No estaba en git —que era la intención del comentario
  # anterior— pero sí a la vista de cualquiera con lectura sobre el proyecto, y
  # hubo que rotarla por eso. Referenciar el secreto es lo que cierra el hueco.
  #
  # TRAMPA: una variable puesta a mano en la consola LE GANA a este archivo. Si
  # algún día el correo sale con una clave que no es esta, mirar allí primero.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  - variable: LEAD_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  - variable: DEMO_NOTIFICATION_TO
    value: dev@qintilab.com,comercial@qintilab.com
    availability:
      - RUNTIME

  # Remitente verificado, el mismo que usan las Cloud Functions
  # (functions/src/email.ts). El anterior, `onboarding@resend.dev`, es el
  # dominio de PRUEBAS de Resend: solo entrega al dueño de la cuenta, así que
  # los avisos de lead a comercial@qintilab.com se perdían en silencio.
  - variable: LEAD_NOTIFICATION_FROM
    value: Vivaru <noreply@notificaciones.grupovivaru.com>
    availability:
      - RUNTIME
