  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1047056648517"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1047056648517:web:a76ad8d0cb2138c3d9d62c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-L1XRDSMWBG
    availability:
      - BUILD
