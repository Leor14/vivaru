name: Frontend App Hosting CI/CD

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # FIN-000: las reglas de Firestore y Storage se prueban contra el emulador en
  # cada push. Job separado del quality-gate a propósito: aquel lleva en rojo
  # desde que el typecheck arrastra errores preexistentes en tests/, y este
  # gate nace en verde y debe seguir asi.
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (lo exige el emulador)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      # El emulador se levanta aparte y no con emulators:exec: la CLI corre el
      # script con su Node empaquetado, que no carga el ESM de vitest.
      - name: Rules tests (emulador Firestore + Storage)
        run: |
          npx firebase emulators:start --only firestore,storage --project hogaru-1-test > emulators.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8080 >/dev/null && curl -s http://127.0.0.1:9199 >/dev/null; then
              echo "emuladores arriba tras ${i}s"; break
            fi
            sleep 1
          done
          npx vitest run --config vitest.rules.config.ts

      - name: Emulator log (solo si algo fallo)
        if: failure()
        run: tail -50 emulators.log

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Firebase deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOGARU_1 }}
          projectId: hogaru-1
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

  deploy-production:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Deploy App Hosting
        uses: w9jds/firebase-action@v14.22.0
        with:
          args: deploy --only apphosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
