# Config de App Hosting para STAGING (proyecto vivaru-staging-02).
# El backend de staging debe tener Environment name = "staging" para leer este
# archivo; el backend de prod (sin environment) usa apphosting.yaml. Es inerte
# para prod, así que puede vivir en cualquier rama.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyChPlJL3WESeNggGXBPMiHzIAAicEH8J6c
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vivaru-staging-02.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vivaru-staging-02
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: vivaru-staging-02.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "765613061037"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:765613061037:web:37c450d7c1a20b4812a724
    availability:
      - BUILD
      - RUNTIME

  # ── Web Push (PRD-V-PLAT-005) ─────────────────────────────────────────────
  # Clave PUBLICA del par VAPID de vivaru-staging-02 (la privada vive en FCM).
  # Cada proyecto tiene su par: esta NO sirve en produccion. Generada por David
  # el 29 ago 2026 en Console → Cloud Messaging → Web Push certificates.
  # Necesita BUILD porque registerWebPush() la inlinea en el bundle del cliente.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BMjUMfHRpsT7tTtLElgHquiBg_IOZYsE1-knlQUmuOj_uVW3HBNsEWVtFPDOYdVpsIHrb2aqgT8yGu6yeEoIzVI
    availability:
      - BUILD
      - RUNTIME

  # ── Resend — Email transaccional ──────────────────────────────────────────
  # RESEND_API_KEY se configura en la consola de App Hosting del backend de
  # staging (Variables de entorno), con una clave de prueba/sandbox.

  - variable: LEAD_NOTIFICATION_TO
    value: dev@qintilab.com
    availability:
      - RUNTIME
  - variable: DEMO_NOTIFICATION_TO
    value: dev@qintilab.com
    availability:
      - RUNTIME
  - variable: LEAD_NOTIFICATION_FROM
    value: Vivaru Staging <onboarding@resend.dev>
    availability:
      - RUNTIME
